[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vitalshield"
version = "0.1.0"
description = "Bloomberg Terminal for Doctors — MCP server for real-time patient intelligence"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Layer 1 — FHIR Ingestion
    "fhirpy>=2.0.0",
    "fhir.resources>=7.1.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",

    # Layer 2 — Terminology
    "rapidfuzz>=3.8.0",

    # Layer 3 — Temporal Engine
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",

    # Layer 4 — CEP (custom, no external dep needed at demo scale)

    # Layer 5 — Neurosymbolic Scorer
    "scikit-learn>=1.4.0",
    "pyod>=1.1.3",

    # Layer 6 — Gemini Agent Fleet
    "google-generativeai>=0.7.0",

    # Layer 7 — Privacy
    "tenseal>=0.3.14",

    # Layer 8 — MCP Server
    "fastmcp>=0.4.0",
    "uvicorn>=0.29.0",

    # Core utilities
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "ipython>=8.24.0",
]
neural = [
    "torch>=2.3.0",
    "tslearn>=0.6.3",
]

[project.scripts]
vitalshield = "vitalshield.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vitalshield"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
