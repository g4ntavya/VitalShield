version: "3.9"

services:
  # HAPI FHIR R4 server — for local demo
  hapi-fhir:
    image: hapiproject/hapi:latest
    container_name: vitalshield-hapi
    ports:
      - "8080:8080"
    environment:
      - hapi.fhir.fhir_version=R4
      - hapi.fhir.default_encoding=json
      - hapi.fhir.allow_multiple_delete=true
      - hapi.fhir.expunge_enabled=true
      - hapi.fhir.subscription.resthook_enabled=true
    volumes:
      - hapi-data:/data/hapi
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/fhir/metadata"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # VitalShield MCP Server
  vitalshield:
    build: .
    container_name: vitalshield-mcp
    ports:
      - "8000:8000"
    environment:
      - FHIR_BASE_URL=http://hapi-fhir:8080/fhir
      - DEMO_MODE=false
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      hapi-fhir:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    restart: unless-stopped

volumes:
  hapi-data:
